[project]
name = "sportcrawl"
version = "2.0.0"
description = "SofaScore Football Match Intelligence & Telegram Bot"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "python-telegram-bot>=21.0",
    "playwright>=1.48",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "websockets>=11.0.3",
    "pydantic-settings>=2.0",
    "aiosqlite>=0.20",
    "sqlalchemy[asyncio]>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[project.scripts]
sportcrawl = "main:cli_entry"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.backends._legacy:_Backend"
