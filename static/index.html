<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SofaScore Football Match Intelligence — Live football fixtures, scores, and tournament tracking">
    <title>SportCrawl — Today's Football Matches & Live Scores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
</head>
<body>
    <div class="app-layout">
        <!-- ── Top Navigation Bar ────────────────────────────── -->
        <header class="navbar">
            <div class="navbar-container">
                <div class="brand">
                    <div class="brand-badge">⚽</div>
                    <div class="brand-text">
                        <span class="brand-name">SPORT<span class="highlight">CRAWL</span></span>
                        <span class="brand-sub">SofaScore Match Intelligence</span>
                    </div>
                </div>

                <div class="nav-controls">
                    <div class="date-pill" id="current-date-badge">
                        <span class="calendar-icon">📅</span>
                        <span id="display-date">Today</span>
                    </div>
                    
                    <button class="btn-refresh" id="btn-trigger-scrape" title="Refresh fixtures from SofaScore">
                        <span class="refresh-icon">🔄</span>
                        <span class="btn-text">Refresh SofaScore</span>
                    </button>

                    <div class="status-indicator online" id="ws-indicator" title="WebSocket Live Stream">
                        <span class="pulse-dot"></span>
                        <span class="status-label" id="ws-status-text">Live Sync</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- ── Main Viewport ─────────────────────────────────── -->
        <main class="main-container">
            <!-- Metric Highlights -->
            <section class="metrics-row">
                <div class="metric-card">
                    <div class="metric-icon blue">📅</div>
                    <div class="metric-content">
                        <div class="metric-val" id="metric-total-today">—</div>
                        <div class="metric-title">Today's Matches</div>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-icon red">🔴</div>
                    <div class="metric-content">
                        <div class="metric-val" id="metric-live-now">—</div>
                        <div class="metric-title">Live In-Play</div>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-icon amber">⭐</div>
                    <div class="metric-content">
                        <div class="metric-val" id="metric-featured-count">—</div>
                        <div class="metric-title">Top Leagues</div>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-icon green">🏁</div>
                    <div class="metric-content">
                        <div class="metric-val" id="metric-finished-count">—</div>
                        <div class="metric-title">Finished Games</div>
                    </div>
                </div>
            </section>

            <!-- Filters & Search Toolbar -->
            <section class="toolbar-section">
                <div class="filter-tabs" id="filter-tabs">
                    <button class="filter-tab active" data-filter="all">
                        <span>⚽ All Games</span>
                        <span class="badge" id="badge-all">0</span>
                    </button>
                    <button class="filter-tab live-tab" data-filter="live">
                        <span class="pulse-red"></span>
                        <span>Live Now</span>
                        <span class="badge red" id="badge-live">0</span>
                    </button>
                    <button class="filter-tab" data-filter="top">
                        <span>⭐ Top Leagues</span>
                        <span class="badge" id="badge-top">0</span>
                    </button>
                    <button class="filter-tab" data-filter="upcoming">
                        <span>🕒 Upcoming</span>
                        <span class="badge" id="badge-upcoming">0</span>
                    </button>
                    <button class="filter-tab" data-filter="finished">
                        <span>🏁 Finished</span>
                        <span class="badge" id="badge-finished">0</span>
                    </button>
                    <button class="filter-tab" data-filter="saved">
                        <span>📌 Pinned</span>
                        <span class="badge" id="badge-saved">0</span>
                    </button>
                </div>

                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="match-search" placeholder="Search team (Arsenal, Madrid...), league, or country..." autocomplete="off">
                    <button class="clear-search" id="clear-search-btn" style="display: none;">✕</button>
                </div>
            </section>

            <!-- Matches List / Cards Grid -->
            <section class="matches-viewport" id="matches-viewport">
                <!-- Dynamic match groupings rendered via JS -->
                <div class="loading-state" id="loading-state">
                    <div class="spinner"></div>
                    <div class="loading-text">Loading today's football fixtures from SofaScore...</div>
                </div>
            </section>
        </main>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="/static/app.js"></script>
</body>
</html>
